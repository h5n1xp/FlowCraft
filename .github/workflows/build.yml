name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (SDL3 build prerequisites)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev \
            libudev-dev libvulkan-dev zip

      - name: Configure (Windows - static SDL3 & static MSVC CRT)
        if: runner.os == 'Windows'
        run: >
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          -DFLOWCRAFT_STATIC_SDL3=ON
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Configure (macOS - static SDL3 Universal Binary)
        if: runner.os == 'macOS'
        run: >
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          -DFLOWCRAFT_STATIC_SDL3=ON
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Configure (Linux - static SDL3 & static libstdc++)
        if: runner.os == 'Linux'
        run: >
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          -DFLOWCRAFT_STATIC_SDL3=ON
          -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path FlowCraft-Windows | Out-Null
          Copy-Item build/Release/FlowCraft.exe FlowCraft-Windows/FlowCraft.exe
          Copy-Item HighWingModel.stl FlowCraft-Windows/HighWingModel.stl
          Copy-Item README.md FlowCraft-Windows/README.md
          Copy-Item LICENSE FlowCraft-Windows/LICENSE
          Compress-Archive -Path FlowCraft-Windows -DestinationPath FlowCraft-Windows.zip -Force

      - name: Package release archive (macOS .app bundle)
        if: runner.os == 'macOS'
        run: |
          mkdir -p FlowCraft-macOS/FlowCraft.app/Contents/MacOS FlowCraft-macOS/FlowCraft.app/Contents/Resources
          cp build/FlowCraft FlowCraft-macOS/FlowCraft.app/Contents/MacOS/FlowCraft
          chmod +x FlowCraft-macOS/FlowCraft.app/Contents/MacOS/FlowCraft
          otool -L FlowCraft-macOS/FlowCraft.app/Contents/MacOS/FlowCraft
          if [ -f FlowCraft/Assets/FlowCraft.icns ]; then
            cp FlowCraft/Assets/FlowCraft.icns FlowCraft-macOS/FlowCraft.app/Contents/Resources/AppIcon.icns
          fi
          cat > FlowCraft-macOS/FlowCraft.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>FlowCraft</string>
            <key>CFBundleIdentifier</key>
            <string>com.flowcraft.app</string>
            <key>CFBundleName</key>
            <string>FlowCraft</string>
            <key>CFBundleDisplayName</key>
            <string>FlowCraft</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.2</string>
            <key>CFBundleVersion</key>
            <string>2</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - FlowCraft-macOS/FlowCraft.app
          cp HighWingModel.stl FlowCraft-macOS/HighWingModel.stl
          cp README.md FlowCraft-macOS/README.md
          cp LICENSE FlowCraft-macOS/LICENSE
          ditto -c -k --sequesterRsrc --keepParent FlowCraft-macOS FlowCraft-macOS.zip

      - name: Package release archive (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p FlowCraft-Linux
          cp build/FlowCraft FlowCraft-Linux/FlowCraft
          chmod +x FlowCraft-Linux/FlowCraft
          ldd FlowCraft-Linux/FlowCraft || true
          cp HighWingModel.stl FlowCraft-Linux/HighWingModel.stl
          cp README.md FlowCraft-Linux/README.md
          cp LICENSE FlowCraft-Linux/LICENSE
          tar -czvf FlowCraft-Linux.tar.gz FlowCraft-Linux
          zip -r FlowCraft-Linux.zip FlowCraft-Linux

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowCraft-${{ runner.os }}
          path: |
            FlowCraft-Windows.zip
            FlowCraft-macOS.zip
            FlowCraft-Linux.tar.gz
            FlowCraft-Linux.zip

  release:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh release-artifacts
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="FlowCraft ${TAG}"
            PRERELEASE_FLAG=""
          else
            TAG="latest"
            TITLE="FlowCraft Latest (Main)"
            PRERELEASE_FLAG="--prerelease"
          fi

          NOTES="Self-contained release packages for **macOS** (Universal Apple Silicon + Intel), **Windows**, and **Linux**.\n\nEach package includes:\n- Standalone **FlowCraft** application (with SDL3 and runtime dependencies statically bundled — no separate SDL3 install required)\n- **HighWingModel.stl** sample aircraft (NACA 2412 high-wing model with -3° washout) for testing\n- **README.md** and **LICENSE**"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TITLE}" --notes "$(echo -e "${NOTES}")"
            gh release upload "${TAG}" release-artifacts/* --clobber
          else
            gh release create "${TAG}" release-artifacts/* \
              --title "${TITLE}" \
              --notes "$(echo -e "${NOTES}")" \
              ${PRERELEASE_FLAG}
          fi
